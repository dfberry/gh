name: Lockfile PR Reminder

on:
  pull_request:
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'solutions/**/package.json'

jobs:
  remind-lockfile:
    name: Remind to update lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check if lockfile would change
        id: check
        run: |
          set -euo pipefail
          npm --version
          # Ensure lockfile generation runs with workspace awareness
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- package-lock.json > lockfile.diff || true
          fi

      - name: Post PR comment when lockfile out-of-sync
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const diff = fs.existsSync('lockfile.diff') ? fs.readFileSync('lockfile.diff', 'utf8') : '';
            const body = `:warning: The repository lockfile (package-lock.json) is out of sync with changes to package.json.

Please run the following at the repository root and commit the updated lockfile:

```
npm install
git add package-lock.json
git commit -m "Update package-lock.json"
git push
```

Lockfile diff:
\n\n```
${diff}
````;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
