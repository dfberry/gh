name: Repo Governance

on:
  # pull_request:
  # push:
  #   branches: [ 'main' ]

jobs:
  verify-github-rest-usage:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run verify-github-rest script
        run: bash ./scripts/verify-github-rest.sh

      - name: Run ban-require check
        run: |
          chmod +x ./scripts/check-no-require.sh
          ./scripts/check-no-require.sh

      - name: Run sync-fs check
        run: |
          chmod +x ./scripts/check-no-sync-fs.sh
          ./scripts/check-no-sync-fs.sh

      - name: Run verify-gh-cleanup check
        run: |
          chmod +x ./scripts/verify-gh-cleanup.sh
          ./scripts/verify-gh-cleanup.sh