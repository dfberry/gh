name: BUILD
description: "Builds and tests the GitHub SDK package (`packages/gh`) on pushes and pull requests that touch that package."

on:
  push:
    paths:
      - 'packages/**'
      - 'solutions/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'packages/**'
      - 'solutions/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-test:
    name: Build and test gh-sdk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Verify package-lock.json is up to date
        working-directory: .
        run: |
          set -euo pipefail
          echo "Checking package-lock.json is up to date..."
          npm --version
          # Generate the lockfile only and check for any changes. If there are, fail with a clear message.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "ERROR: package-lock.json is out of sync with package.json or workspace packages."
            echo "Run 'npm install' at the repository root and commit the updated package-lock.json."
            echo "Lockfile diff:"
            git --no-pager diff -- package-lock.json || true
            exit 1
          fi

      - name: Install 
        working-directory: .
        # Use `npm install` for installs to get latest versions of dependencies
        run: |
          node -v
          npm -v
          npm ci

      - name: Build
        working-directory: .
        # Use the root build which now uses `tsc -b` to build project references
        run: npm run build

      - name: Tests
        working-directory: .
        run: npm run test
