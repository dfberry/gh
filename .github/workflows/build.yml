name: BUILD
description: "Builds and tests the GitHub SDK package (`packages/gh`) on pushes and pull requests that touch that package."

on:
  push:
    paths:
      - 'packages/**'
      - 'solutions/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'packages/**'
      - 'solutions/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-test:
    name: Build and test gh-sdk
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm version to match local
        run: |
          set -eux
          npm --version || true
          npm install -g npm@11.6.2
          echo "pnpm/npm pinned:" $(npm --version)

