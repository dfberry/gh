      - name: Install dependencies
        working-directory: .
        # Run installs and write output to a log file for artifact upload
        run: |
          set -eu
          echo "Running install and capturing output to ci-install.log"
          node -v > ci-install.log 2>&1 || true
          npm -v >> ci-install.log 2>&1 || true
          npm ci >> ci-install.log 2>&1 || (cat ci-install.log && exit 1)


      - name: Upload sanitized lockfile diffs and install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            package-lock.sanitized.*.json
            ci-install.log
            package-lock.baseline.txt
            package-lock.ls-root.txt
            package-lock.ls-git.txt
            package-lock.repo-root.txt
            package-lock.git-status.txt
            package-lock.committed.json
          if-no-files-found: warn

      - name: Build
        working-directory: .
        # Use the root build which now uses `tsc -b` to build project references
        run: npm run build

      - name: Tests
        working-directory: .
        run: npm run test
