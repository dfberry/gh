name: BUILD
description: "Builds and tests the GitHub SDK package (`packages/gh`) on pushes and pull requests that touch that package."

on:
  push:
    paths:
      - 'packages/**'
  pull_request:
    paths:
      - 'packages/**'

jobs:
  build-and-test:
    name: Build and test gh-sdk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Install 
        working-directory: .
        # Use `npm ci` for clean, repeatable installs in CI and enable caching
        run: |
          node -v
          npm -v
          npm ci

      - name: Build
        working-directory: .
        # Use the root build which now uses `tsc -b` to build project references
        run: npm run build

      - name: Tests
        working-directory: .
        run: npm run test
