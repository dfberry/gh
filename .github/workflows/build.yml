name: BUILD
description: "Builds and tests the GitHub SDK package (`packages/gh`) on pushes and pull requests that touch that package."

on:
  push:
    paths:
      - 'packages/**'
      - 'solutions/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'packages/**'
      - 'solutions/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-and-test:
    name: Build and test gh-sdk
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify package-lock.json is up to date
        id: verify-lock
        working-directory: .
        shell: bash -l {0}
        run: |
          set -eu
          echo "Checking package-lock.json is up to date..."
          npm --version
          # Save committed lockfile
          if git show HEAD:package-lock.json > package-lock.committed.json 2>/dev/null; then
            echo "Saved committed lockfile"
          else
            echo "No committed package-lock.json found; continuing check against empty baseline"
            echo '{}' > package-lock.committed.json
          fi
          # Generate the lockfile only
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node ./scripts/compare-lockfiles.js package-lock.committed.json package-lock.json || (
            echo "ERROR: package-lock.json is out of sync with package.json or workspace packages (ignoring harmless metadata)."
            echo "Run 'npm install' at the repository root and commit the updated package-lock.json."
            echo "Sanitized lockfile differences written to package-lock.sanitized.*.json"
            exit 1
          )

      - name: Upload sanitized lockfile diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-lockfile-diffs
          path: package-lock.sanitized.*.json
          if-no-files-found: warn

      - name: Install 
        working-directory: .
        # Use `npm install` for installs to get latest versions of dependencies
        run: |
          node -v
          npm -v
          npm ci

      - name: Build
        working-directory: .
        # Use the root build which now uses `tsc -b` to build project references
        run: npm run build

      - name: Tests
        working-directory: .
        run: npm run test
