name: Orchestrator Smoke Tests

# Smoke test workflow (manual run only).
# Requires secrets to be configured in repository Settings -> Secrets and variables -> Actions:
# - GH_TOKEN: Personal Access Token with `repo` scope for read-only operations. If you need destructive
#   operations in CI (not recommended), add `delete_repo` and any other required scopes.
# - OPENAI_API_KEY: (optional) API key for LLM steps if you want to run descriptions in CI.
# Notes:
# - This workflow is intended for manual dry-run smoke tests. Do NOT forward `--yes`/`--force` in PRs.
# - To run: Actions → Orchestrator Smoke Tests → Run workflow.
on:
  workflow_dispatch:
#  push:
#  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install root deps
        run: npm ci

      - name: Build gh-cleanup
        run: npm --prefix packages/gh-cleanup run build

      - name: Run gather dry-run smoke
        run: ./scripts/run-gather.sh active-sample-repos.json $(pwd)/generated/gh-cleanup-gather gather-dryrun

      - name: Run change dry-run smoke
        run: ./scripts/run-change.sh active-sample-repos.json $(pwd)/generated/gh-cleanup-change change-dryrun

      - name: List outputs
        run: ls -la $(pwd)/generated/gh-cleanup-gather || true && ls -la $(pwd)/generated/gh-cleanup-change || true

      - name: Upload gather outputs
        uses: actions/upload-artifact@v4
        with:
          name: gather-outputs
          path: generated/gh-cleanup-gather

      - name: Upload change outputs
        uses: actions/upload-artifact@v4
        with:
          name: change-outputs
          path: generated/gh-cleanup-change
